[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

;========================
; PHP-FPM Configuration (poprawiona ścieżka dla Alpine)
;========================
[program:php-fpm]
command=/bin/sh -c "mkdir -p /var/run/php-fpm && /usr/local/sbin/php-fpm -F"
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
autostart=true
startsecs=0
priority=5
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
; Dodane environment variables
environment=PHP_FPM_USER="nobody",PHP_FPM_GROUP="nobody"

;========================
; Nginx Configuration
;========================
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autorestart=true
autostart=true
priority=10
startsecs=0
; Nginx czeka na PHP-FPM
; depends_on=php-fpm

;========================
; Laravel Queue Worker (optional)
;========================
[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/local/bin/php /app/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
startsecs=0
